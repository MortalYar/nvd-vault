name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@bcc6241fb3f725642e130ea90f590d8d273da42b # v6.0.2


      - name: Set up Python
        uses: actions/setup-python@d87cb779c1857bd339b7663d9415b9cc9bbe25a3 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check . 
  
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@bcc6241fb3f725642e130ea90f590d8d273da42b # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@d87cb779c1857bd339b7663d9415b9cc9bbe25a3 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy nvd_vault

  audit:
    name: Audit dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@bcc6241fb3f725642e130ea90f590d8d273da42b # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@d87cb779c1857bd339b7663d9415b9cc9bbe25a3 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit and pip-tools
        run: python -m pip install pip-audit pip-tools

      - name: Compile requirements from pyproject.toml
        run: |
          pip-compile --extra=dev --generate-hashes --output-file=audit-requirements.txt pyproject.toml

      - name: Run pip-audit
        run: pip-audit --strict --disable-pip --requirement audit-requirements.txt

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Экономим минуты CI: macOS гоняем только на свежей версии Python
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@bcc6241fb3f725642e130ea90f590d8d273da42b # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@d87cb779c1857bd339b7663d9415b9cc9bbe25a3 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1  
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14