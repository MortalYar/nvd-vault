name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Каждый понедельник в 06:30 UTC — догоняем новые правила CodeQL
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "javascript-typescript" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@bcc6241fb3f725642e130ea90f590d8d273da42b # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2f90a82ab7eece7aa899ce5d384db49efd7337ea # v4.35.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2f90a82ab7eece7aa899ce5d384db49efd7337ea # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"