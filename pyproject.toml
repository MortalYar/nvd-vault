[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvd-vault"
version = "0.1.0"
description = "Desktop tool for building a local vulnerability knowledge vault from NVD, EPSS and CISA KEV data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "MortalYar" }
]
dependencies = [
    "pywebview>=6.0",
    "requests>=2.28",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
nvd-vault = "app:main"

[tool.setuptools]
py-modules = ["app"]
packages = ["nvd_vault", "nvd_vault.api", "nvd_vault.core", "nvd_vault.webui"]

[tool.setuptools.package-data]
"nvd_vault.webui" = [
    "index.html",
    "css/*.css",
    "js/*.js",
    "assets/*",
    "vendor/*.js"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert False` in tests