[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvd-vault"
version = "0.1.0"
description = "Desktop tool for building a local vulnerability knowledge vault from NVD, EPSS and CISA KEV data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "MortalYar" }
]
keywords = [
    "vulnerability",
    "security",
    "cve",
    "nvd",
    "epss",
    "cisa-kev",
    "sbom",
    "vulnerability-management",
    "security-tools",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pywebview>=6.0",
    "requests>=2.28",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/MortalYar/nvd-vault"
Repository = "https://github.com/MortalYar/nvd-vault"
Issues = "https://github.com/MortalYar/nvd-vault/issues"
Documentation = "https://github.com/MortalYar/nvd-vault#readme"
Changelog = "https://github.com/MortalYar/nvd-vault/releases"
"Security Policy" = "https://github.com/MortalYar/nvd-vault/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
]

[project.scripts]
nvd-vault = "app:main"

[tool.setuptools]
py-modules = ["app"]
packages = ["nvd_vault", "nvd_vault.api", "nvd_vault.core", "nvd_vault.webui"]

[tool.setuptools.package-data]
"nvd_vault.webui" = [
    "index.html",
    "css/*.css",
    "js/*.js",
    "assets/*",
    "vendor/*.js"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert False` in tests

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# В тестах типы не критичны — проверяем только продакшен-код
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# pywebview не имеет stub-файлов
[[tool.mypy.overrides]]
module = "webview.*"
ignore_missing_imports = true

# packaging тоже частично типизирована
[[tool.mypy.overrides]]
module = "packaging.*"
ignore_missing_imports = true